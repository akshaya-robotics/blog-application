<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Dashboard - My Blog</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        nav {
            background: #222;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: #ddd;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .dashboard-header h1 {
            margin: 0;
        }

        .create-btn {
            background: #222;
            color: white;
            padding: 12px 18px;
            text-decoration: none;
            border-radius: 6px;
        }

        .create-btn:hover {
            background: #444;
        }

        /* PROFILE */

        .profile-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .profile-card h2 {
            margin-top: 0;
        }

        .profile-card p {
            margin: 8px 0;
        }

        /* SEARCH */

        .search-container {
            margin-bottom: 25px;
        }

        #searchInput,
        #categoryFilter {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            background: white;
            color: #333;
        }

        #categoryFilter {
            margin-top: 10px;
            cursor: pointer;
        }

        /* BLOG LIST */

        #blog-list {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );
            gap: 20px;
        }

        .blog-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .blog-card h2 {
            margin-top: 0;
        }

        .author {
            color: #777;
            font-size: 14px;
        }

        .category {
            font-size: 14px;
            font-weight: bold;
            margin: 10px 0;
        }

        .actions {
            margin-top: 15px;
        }

        .actions a,
        .actions button {
            display: inline-block;
            border: none;
            padding: 9px 14px;
            margin-right: 8px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .actions a {
            background: #eee;
            color: #222;
        }

        .edit-btn {
            background: #ddd;
            color: #222;
        }

        .delete-btn {
            background: #222;
            color: white;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            nav {
                flex-direction: column;
                gap: 10px;
            }

            nav a {
                margin: 0 8px;
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>


<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav>

        <div class="logo">
            My Blog
        </div>

        <div>

            <a href="index.html">
                Home
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="create-blog.html">
                Create Blog
            </a>

            <a href="profile.html">
                Profile
            </a>

            <a href="#" onclick="logout(); return false;">
                Logout
            </a>

        </div>

    </nav>


    <!-- =========================
         DASHBOARD
    ========================== -->

    <div class="container">

        <div class="dashboard-header">

            <h1>
                My Dashboard
            </h1>

            <a
                href="create-blog.html"
                class="create-btn"
            >
                + Create Blog
            </a>

        </div>


        <!-- =========================
             PROFILE SUMMARY
        ========================== -->

        <div class="profile-card">

            <h2>
                Welcome, <span id="user-name">User</span>!
            </h2>

            <p>
                <strong>Email:</strong>
                <span id="user-email"></span>
            </p>

        </div>


        <!-- =========================
             SEARCH
        ========================== -->

        <div class="search-container">

            <input
                type="text"
                id="searchInput"
                placeholder="Search blogs..."
                onkeyup="searchBlogs()"
            >


            <select
                id="categoryFilter"
                onchange="filterBlogs()"
            >

                <option value="">
                    All Categories
                </option>

                <option value="Technology">
                    Technology
                </option>

                <option value="Robotics">
                    Robotics
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="Projects">
                    Projects
                </option>

                <option value="Personal">
                    Personal
                </option>

            </select>

        </div>


        <!-- =========================
             BLOG LIST
        ========================== -->

        <div id="blog-list"></div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/script.js"></script>

</body>

</html>
