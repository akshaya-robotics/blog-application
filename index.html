<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Blog</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        nav {
            background: #222;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            background: white;
            padding: 70px 20px;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #666;
            font-size: 18px;
        }

        .buttons {
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 6px;
            text-decoration: none;
        }

        .primary {
            background: #222;
            color: white;
        }

        .secondary {
            background: #ddd;
            color: #222;
        }

        .posts {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        .posts h2 {
            text-align: center;
        }

        .post {
            background: white;
            padding: 25px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        footer {
            margin-top: 50px;
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>

    <section class="hero">

        <h1>Welcome to My Blog</h1>

        <p>
            Share your thoughts, ideas, projects and stories.
        </p>

        <div class="buttons">

            <a href="register.html" class="btn primary">
                Get Started
            </a>

            <a href="login.html" class="btn secondary">
                Login
            </a>

        </div>

    </section>

    <section class="posts">

        <h2>Recent Blog Posts</h2>

        <div class="post">

            <h3>My Robotics Project</h3>

            <p>
                Welcome to my blog. This is where I share
                my projects, ideas and experiences.
            </p>

        </div>

    </section>

    <footer>

        <p>© 2026 My Blog</p>

    </footer>
<script>
    const recentPosts = document.querySelector(".posts");

    const blogs =
        JSON.parse(localStorage.getItem("blogs")) || [];

    if (blogs.length > 0) {

        const postsHeading =
            recentPosts.querySelector("h2");

        const oldPost =
            recentPosts.querySelector(".post");

        if (oldPost) {
            oldPost.remove();
        }

        blogs.forEach(function(blog, index) {

            const post = document.createElement("div");

            post.className = "post";

            post.innerHTML = `
                <h3>${blog.title}</h3>

                <p>
                    By ${blog.author}
                </p>

                <p>
                    Category:
                    ${blog.category || "Not specified"}
                </p>

                <p>
    ${
        blog.content.length > 150
            ? blog.content.substring(0, 150) + "..."
            : blog.content
    }
</p>

                <a
                    href="blog-details.html"
                    onclick="localStorage.setItem('selectedBlog', ${index})"
                >
                    Read More
                </a>
            `;

            recentPosts.appendChild(post);
        });
    }
</script>
</body>
</html>
